<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemprop test page</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { margin-bottom: 0; }
  .muted { color: GrayText; font-size: .9rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .75rem 0; }
  #drop { border: 2px dashed GrayText; border-radius: 10px; padding: 1.5rem; text-align: center; cursor: pointer; }
  #drop:focus, #drop.over { outline: 2px solid Highlight; }
  #preview, #drawing { max-width: 100%; max-height: 260px; background: #fff; border: 1px solid GrayText; border-radius: 8px; }
  #status.error { color: #c0392b; }
  dl { display: grid; grid-template-columns: 11rem 1fr; gap: .25rem .75rem; }
  dt { font-weight: 600; } dd { margin: 0; word-break: break-word; }
  .warn { color: #b9770e; }
  input[type=text] { min-width: 16rem; }
</style>
</head>
<body>
<h1>Chemprop</h1>
<p class="muted">Test page served by the backend. CBSE only.</p>

<div class="row"><label for="grade">Class</label><select id="grade"></select></div>

<div id="drop" tabindex="0" role="button">
  Paste a screenshot (Ctrl+V), drop an image here, or click to choose a file
  <input type="file" id="file" accept="image/*" hidden>
</div>

<div class="row">
  <select id="kind" aria-label="Input type"><option value="name">Name</option><option value="smiles">SMILES</option></select>
  <input type="text" id="text" placeholder="e.g. aspirin" aria-label="Name or SMILES">
  <button id="go" type="button">Analyze</button>
</div>

<img id="preview" alt="Your image" hidden>
<p id="status" role="status"></p>

<section id="result" hidden>
  <h2>Structure understood</h2>
  <img id="drawing" alt="Drawing of the structure the app understood">
  <p class="muted">Is this your molecule? If not, edit the SMILES and re-analyse.</p>
  <div class="row"><input type="text" id="smiles" aria-label="SMILES"><button id="again" type="button">Re-analyse</button></div>
  <dl id="details"></dl>
  <h3>Explanations</h3>
  <div id="props"></div>
</section>

<script>window.CHEMPROP_API = "";</script>
<script type="module">
import { fillGradeSelect, analyzeText, analyzeImage, enableImagePaste } from "./chemprop-api.js";

const $ = (id) => document.getElementById(id);
const gradeEl = $("grade");
fillGradeSelect(gradeEl);
const grade = () => Number(gradeEl.value);
let last = null;           // how to repeat the last successful analysis (used when the class changes)
let previewUrl = null;

function setStatus(message, isError = false) {
  $("status").textContent = message;
  $("status").className = isError ? "error" : "";
}

function add(dl, label, value, cls) {
  const dt = document.createElement("dt"); dt.textContent = label;
  const dd = document.createElement("dd"); dd.textContent = value; if (cls) dd.className = cls;
  dl.append(dt, dd);
}

function show(r) {
  $("drawing").hidden = !r.structure_svg;
  if (r.structure_svg) $("drawing").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(r.structure_svg);
  $("smiles").value = r.smiles;
  const dl = $("details"); dl.textContent = "";
  add(dl, "Source", r.source);
  if (r.confidence !== null) add(dl, "Confidence", Math.round(r.confidence * 100) + "%");
  if (r.iupac_name) add(dl, "IUPAC name", r.iupac_name);
  if (r.common_name) add(dl, "Name", r.common_name);
  add(dl, "Formula", r.formula);
  add(dl, "Molecular weight", r.analysis.mol_weight + " g/mol");
  add(dl, "Groups for Class " + r.grade, r.relevant_groups.join(", ") || "none detected");
  if (r.out_of_syllabus_groups.length) add(dl, "Beyond this class", r.out_of_syllabus_groups.join(", "));
  r.warnings.forEach((w) => add(dl, "Note", w, "warn"));
  const props = $("props"); props.textContent = "";
  if (!r.properties.length) {
    props.textContent = "No explanations yet. They appear here once the explanation module is connected.";
  }
  r.properties.forEach((p) => {
    const box = document.createElement("p");
    box.textContent = `${p.name}${p.value ? ": " + p.value : ""}. ${p.explanation || ""}`;
    props.append(box);
  });
  $("result").hidden = false;
  last = () => analyzeText({ smiles: r.smiles }, grade());   // class change re-uses the SMILES, no second OCR
}

async function run(job) {
  setStatus("Working...");
  try {
    show(await job());
    setStatus("");
  } catch (e) {
    $("result").hidden = true;
    setStatus(e.message + (e.code ? ` (${e.code})` : ""), true);
    if (e.data && e.data.smiles) {            // the model read something that is not a valid molecule
      $("kind").value = "smiles"; $("text").value = e.data.smiles;
    }
  }
}

function onImage(file) {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);
  $("preview").src = previewUrl; $("preview").hidden = false;
  run(() => analyzeImage(file, grade()));
}

enableImagePaste($("drop"), onImage);
$("drop").addEventListener("click", () => $("file").click());
$("drop").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") $("file").click(); });
$("drop").addEventListener("dragenter", () => $("drop").classList.add("over"));
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", () => $("drop").classList.remove("over"));
$("file").addEventListener("change", () => { if ($("file").files[0]) onImage($("file").files[0]); $("file").value = ""; });

function analyzeTyped() {
  const value = $("text").value.trim();
  if (value) run(() => analyzeText({ [$("kind").value]: value }, grade()));
}
$("go").addEventListener("click", analyzeTyped);
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") analyzeTyped(); });
$("again").addEventListener("click", () => {
  const value = $("smiles").value.trim();
  if (value) run(() => analyzeText({ smiles: value }, grade()));
});
gradeEl.addEventListener("change", () => { if (last) run(last); });
</script>
</body>
</html>
